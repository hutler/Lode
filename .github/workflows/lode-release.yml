name: lode-release

# Builds `lode` and `loded` for every supported platform, with checksums, plus the server
# packages (.deb and .rpm for Linux, an MSI for Windows; each is installed, started and removed
# here first) and the Lode Desk bundles with their update feed, and publishes them as a GitHub
# release when a tag `lode-v<version>` is pushed. A manual run builds the same
# archives and keeps them as workflow artifacts without releasing anything.

on:
  push:
    tags: ["lode-v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: lode
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          # Static musl binaries, built in cross's containers (C dependencies included).
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest, cross: true }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-latest, cross: true }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: aarch64-apple-darwin, os: macos-latest }
    steps:
      - uses: actions/checkout@v4
        with:
          # All history and tags, for the build version (commits since the newest release).
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build version
        run: |
          build="$(cargo run -q --locked -p lode-build --bin lode-build-version)"
          echo "Build version: $build"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$build" != "${GITHUB_REF_NAME#lode-v}" ]; then
            echo "::error::the programs would say $build, not ${GITHUB_REF_NAME#lode-v}: set version in lode/Cargo.toml to the tag's"
            exit 1
          fi
          echo "LODE_BUILD_VERSION=$build" >> "$GITHUB_ENV"
      - uses: taiki-e/install-action@v2
        if: matrix.cross
        with:
          tool: cross
      - name: Build
        env:
          # No Visual C++ runtime needed on the target machine.
          RUSTFLAGS: ${{ contains(matrix.target, 'windows') && '-C target-feature=+crt-static' || '' }}
        run: |
          tool=cargo
          if [ "${{ matrix.cross }}" = "true" ]; then tool=cross; fi
          $tool build --release --locked --target ${{ matrix.target }} -p lode-cli -p loded
      - name: Package
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="${GITHUB_REF_NAME#lode-v}"
          else
            version="dev-${GITHUB_SHA::7}"
          fi
          target=${{ matrix.target }}
          name="lode-$version-$target"
          ext=""
          case "$target" in *windows*) ext=".exe" ;; esac
          mkdir -p "dist/$name"
          cp "target/$target/release/lode$ext" "target/$target/release/loded$ext" \
             LICENSE README.md "dist/$name/"
          cp -R packaging "dist/$name/packaging"
          cd dist
          if [ -n "$ext" ]; then
            7z a -tzip "$name.zip" "$name" > /dev/null
            archive="$name.zip"
          else
            tar czf "$name.tar.gz" "$name"
            archive="$name.tar.gz"
          fi
          if command -v sha256sum > /dev/null; then
            sha256sum "$archive" > "$archive.sha256"
          else
            shasum -a 256 "$archive" > "$archive.sha256"
          fi
          cat "$archive.sha256"
          # The staging folder has the bare executable's name on Linux and macOS.
          rm -rf "$name"
          # The bare client executable, which `lode self-update` downloads.
          cp "../target/$target/release/lode$ext" "lode-$version-$target$ext"
          if command -v sha256sum > /dev/null; then
            sha256sum "lode-$version-$target$ext" > "lode-$version-$target$ext.sha256"
          else
            shasum -a 256 "lode-$version-$target$ext" > "lode-$version-$target$ext.sha256"
          fi
      - uses: actions/setup-go@v5
        if: contains(matrix.target, 'linux')
        with:
          go-version: stable
          cache: false
      - name: Linux packages (.deb, .rpm)
        if: contains(matrix.target, 'linux')
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.49.0
          cargo_version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="${GITHUB_REF_NAME#lode-v}"
          else
            version="$cargo_version-dev.${GITHUB_SHA::7}"
          fi
          case "${{ matrix.target }}" in
            x86_64-*) deb_arch=amd64; rpm_arch=x86_64 ;;
            aarch64-*) deb_arch=arm64; rpm_arch=aarch64 ;;
          esac
          export VERSION="$version" BIN="target/${{ matrix.target }}/release" COMPLETIONS=dist-completions
          sh packaging/linux/completions.sh "$BIN" "$COMPLETIONS"
          for p in lode-server lode; do
            ARCH=$deb_arch "$(go env GOPATH)/bin/nfpm" package -f "packaging/linux/$p.yaml" -p deb \
              -t "dist/${p}_${version}_${deb_arch}.deb"
            ARCH=$deb_arch "$(go env GOPATH)/bin/nfpm" package -f "packaging/linux/$p.yaml" -p rpm \
              -t "dist/${p}-${version}.${rpm_arch}.rpm"
          done
          cd dist
          for f in *.deb *.rpm; do sha256sum "$f" > "$f.sha256"; done
      - name: Windows installer (.msi)
        if: contains(matrix.target, 'windows')
        run: |
          dotnet tool install --global wix --version 5.0.2
          export PATH="$PATH:$HOME/.dotnet/tools"
          wix extension add --global WixToolset.UI.wixext/5.0.2
          wix extension add --global WixToolset.Util.wixext/5.0.2
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="${GITHUB_REF_NAME#lode-v}"
          else
            version="dev-${GITHUB_SHA::7}"
          fi
          # MSI versions are numbers only: the Cargo version.
          msi_version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          msi="dist/lode-server-$version-x64.msi"
          wix build packaging/windows/lode-server.wxs -arch x64 \
            -ext WixToolset.UI.wixext -ext WixToolset.Util.wixext \
            -d Version="$msi_version" -d BinDir="target/${{ matrix.target }}/release" -o "$msi"
          client="dist/lode-$version-x64.msi"
          wix build packaging/windows/lode.wxs -arch x64 -ext WixToolset.UI.wixext \
            -d Version="$msi_version" -d BinDir="target/${{ matrix.target }}/release" -o "$client"
          rm -f dist/*.wixpdb
          cd dist
          for f in *.msi; do sha256sum "$f" > "$f.sha256"; done
      - name: Install, start and uninstall the MSI
        if: contains(matrix.target, 'windows')
        shell: pwsh
        run: |
          ./packaging/windows/test-msi.ps1 (Get-ChildItem dist/lode-server-*.msi).FullName
          ./packaging/windows/test-client-msi.ps1 `
            (Get-ChildItem dist/lode-*-x64.msi -Exclude lode-server-*).FullName `
            (Get-ChildItem dist/lode-server-*.msi).FullName
      - uses: actions/upload-artifact@v4
        with:
          name: lode-${{ matrix.target }}
          path: |
            lode/dist/*.tar.gz
            lode/dist/*.zip
            lode/dist/*.deb
            lode/dist/*.rpm
            lode/dist/*.msi
            lode/dist/lode-*-unknown-linux-musl
            lode/dist/lode-*-apple-darwin
            lode/dist/lode-*-pc-windows-msvc.exe
            lode/dist/*.sha256
          if-no-files-found: error

  packages:
    name: packages on ${{ matrix.image }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ["debian:bookworm", "ubuntu:24.04", "rockylinux:9", "fedora:41"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: lode-x86_64-unknown-linux-musl
          path: lode/dist
      - name: Install, start and remove the .deb or .rpm
        working-directory: lode
        run: |
          cat dist/*.sha256 | sed 's/ \*/  /' > dist/SHA256SUMS
          docker run --rm -v "$PWD:/src" -w /src "${{ matrix.image }}" \
            packaging/linux/test-package.sh dist

  release:
    needs: [build, packages]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          # The CLI and server builds only; Lode Desk's are attached by desk-feed.
          pattern: lode-{x86_64,aarch64}-*
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: |
          cat *.sha256 | sed 's/ \*/  /' > SHA256SUMS
          sha256sum -c SHA256SUMS
          cat SHA256SUMS
      - uses: actions/checkout@v4
        with:
          path: src
      - name: winget and Homebrew manifests
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="${GITHUB_REF_NAME#lode-v}"
          else
            version="dev-${GITHUB_SHA::7}"
          fi
          src/lode/packaging/render-manifests.sh "$version" dist/SHA256SUMS manifests
      - uses: actions/upload-artifact@v4
        with:
          name: lode-release
          path: |
            dist/
            manifests/
      - name: Publish the release
        if: github.ref_type == 'tag'
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "Lode ${GITHUB_REF_NAME#lode-v}" --generate-notes \
            ./*.tar.gz ./*.zip ./*.deb ./*.rpm ./*.msi \
            ./lode-*-unknown-linux-musl ./lode-*-apple-darwin ./lode-*-pc-windows-msvc.exe SHA256SUMS

  # Lode Desk: every installer built on its own system by cargo-packager, the Linux ones
  # installed here, the update feed written and checked, and (for a tag) all of it attached to
  # the release.
  desk:
    name: Lode Desk on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: lode/crates/lode-desk
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, formats: "deb,appimage", platform: linux-x86_64 }
          - { os: windows-latest, formats: "wix,nsis", platform: windows-x86_64 }
          - { os: macos-latest, formats: "app,dmg", platform: macos-universal }
    env:
      # The update key: the private half is a secret, the public half a repository variable
      # that the build puts into the app. Without them the installers are not signed for
      # updates and the app never offers one.
      CARGO_PACKAGER_SIGN_PRIVATE_KEY: ${{ secrets.LODE_DESK_UPDATE_KEY }}
      CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD: ${{ secrets.LODE_DESK_UPDATE_KEY_PASSWORD }}
      LODE_DESK_UPDATE_PUBKEY: ${{ vars.LODE_DESK_UPDATE_PUBKEY }}
      HAS_WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE != '' }}
      HAS_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-packager@0.11.8
      - name: System libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev
      - name: Version and update key
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="${GITHUB_REF_NAME#lode-v}"
          else
            version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          # The package's own version (the first `version =`), and its entry in the lock file.
          perl -0pi -e 's/^version = "[^"]*"/version = "'"$version"'"/m' Cargo.toml
          perl -0pi -e 's/(name = "lode-desk"\nversion = )"[^"]*"/$1"'"$version"'"/' Cargo.lock
          if [ -n "$CARGO_PACKAGER_SIGN_PRIVATE_KEY" ]; then
            if [ -z "$LODE_DESK_UPDATE_PUBKEY" ]; then
              echo "::error::LODE_DESK_UPDATE_KEY is set but the LODE_DESK_UPDATE_PUBKEY variable is not"
              exit 1
            fi
          else
            echo "::warning::No update key: the installers are not signed for updates and never offer one"
            echo "LODE_DESK_UPDATE_PUBKEY=" >> "$GITHUB_ENV"
          fi
      # Code signing is wired but off until the project has certificates: each part runs only
      # when its secrets are set.
      - name: Windows code signing certificate
        if: runner.os == 'Windows' && env.HAS_WINDOWS_CERTIFICATE == 'true'
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP cert.pfx
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $pw = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $pw
          "`n[package.metadata.packager.windows]`ncertificate-thumbprint = `"$($cert.Thumbprint)`"`ntimestamp-url = `"http://timestamp.digicert.com`"" | Add-Content Cargo.toml
      - name: macOS code signing and notarization
        if: runner.os == 'macOS' && env.HAS_APPLE_CERTIFICATE == 'true'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          {
            echo "APPLE_CERTIFICATE=${{ secrets.APPLE_CERTIFICATE }}"
            echo "APPLE_CERTIFICATE_PASSWORD=${{ secrets.APPLE_CERTIFICATE_PASSWORD }}"
            echo "APPLE_ID=${{ secrets.APPLE_ID }}"
            echo "APPLE_PASSWORD=${{ secrets.APPLE_PASSWORD }}"
            echo "APPLE_TEAM_ID=${{ secrets.APPLE_TEAM_ID }}"
          } >> "$GITHUB_ENV"
          perl -0pi -e 's/(\[package\.metadata\.packager\.macos\]\n)/$1signing-identity = "$ENV{APPLE_SIGNING_IDENTITY}"\n/' Cargo.toml
      - name: Build the app
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            # One program for Intel and Apple silicon.
            cargo build --release --locked --target aarch64-apple-darwin
            cargo build --release --locked --target x86_64-apple-darwin
            mkdir -p target/universal/release
            lipo -create -output target/universal/release/lode-desk \
              target/aarch64-apple-darwin/release/lode-desk target/x86_64-apple-darwin/release/lode-desk
            # `cargo packager --release` takes the program from target/release whatever
            # --binaries-dir says, so the universal one goes there too.
            mkdir -p target/release
            cp target/universal/release/lode-desk target/release/lode-desk
            echo "BINARIES=target/universal/release" >> "$GITHUB_ENV"
          else
            cargo build --release --locked
            echo "BINARIES=target/release" >> "$GITHUB_ENV"
          fi
      - name: Installers
        run: |
          cargo packager --release --formats ${{ matrix.formats }} \
            --binaries-dir "$BINARIES" --out-dir target/packages
          ls -l target/packages
      - name: Collect the installers
        run: |
          mkdir -p dist
          name="lode-desk-$VERSION-${{ matrix.platform }}"
          take() { # take SOURCE_GLOB TARGET_NAME: copies one installer and its signature, if any
            for f in $1; do
              [ -f "$f" ] || continue
              cp "$f" "dist/$2"
              [ -f "$f.sig" ] && cp "$f.sig" "dist/$2.sig"
            done
          }
          out=target/packages
          take "$out/*.AppImage" "$name.AppImage"
          take "$out/*.deb" "$name.deb"
          take "$out/*.msi" "$name.msi"
          take "$out/*-setup.exe" "$name-setup.exe"
          take "$out/*.dmg" "$name.dmg"
          take "$out/*.app.tar.gz" "$name.app.tar.gz"
          ls -l dist
          [ -n "$(ls dist)" ] || { echo "::error::no installers were built"; exit 1; }
      - name: Install the .deb and check it
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y ./dist/lode-desk-*.deb
          desktop=$(dpkg -L lode-desk | grep '\.desktop$')
          grep -q 'x-scheme-handler/lode' "$desktop"
          bin=$(dpkg -L lode-desk | grep '/bin/' | head -n 1)
          ! ldd "$bin" | grep 'not found'
          sudo apt-get remove -y lode-desk
      - name: Check the AppImage
        if: runner.os == 'Linux'
        run: |
          appimage=$(ls dist/*.AppImage)
          chmod +x "$appimage"
          (cd "$RUNNER_TEMP" && "$GITHUB_WORKSPACE/lode/crates/lode-desk/$appimage" --appimage-extract > /dev/null)
          grep -q 'x-scheme-handler/lode' "$RUNNER_TEMP"/squashfs-root/*.desktop
      - name: Install the MSI and check that it registers lode links
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $msi = (Get-ChildItem dist/*.msi).FullName
          $p = Start-Process msiexec.exe -ArgumentList "/i `"$msi`" /qn /norestart" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "msiexec exited with $($p.ExitCode)" }
          $cmd = (Get-ItemProperty "Registry::HKEY_CLASSES_ROOT\lode\shell\open\command").'(default)'
          Write-Output "lode:// opens: $cmd"
          # The installer may write the short (8.3) form of the path; the file's own name is
          # the long one.
          $exe = ($cmd -split '"')[1]
          if (-not $exe -or -not (Test-Path -LiteralPath $exe)) { throw "the lode scheme names no program: $cmd" }
          Add-Type -Namespace Win32 -Name Paths -MemberDefinition '[DllImport("kernel32.dll", CharSet = CharSet.Unicode)] public static extern uint GetLongPathName(string shortPath, System.Text.StringBuilder longPath, uint size);'
          $sb = New-Object System.Text.StringBuilder 1024
          if ([Win32.Paths]::GetLongPathName($exe, $sb, 1024) -eq 0) { throw "cannot read the long form of $exe" }
          $long = $sb.ToString()
          Write-Output "that is: $long"
          if ((Split-Path -Leaf $long) -ne 'lode-desk.exe') { throw "the lode scheme does not open lode-desk.exe: $cmd" }
          $p = Start-Process msiexec.exe -ArgumentList "/x `"$msi`" /qn /norestart" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "uninstall exited with $($p.ExitCode)" }
      - uses: actions/upload-artifact@v4
        with:
          name: lode-desk-${{ matrix.platform }}
          path: lode/crates/lode-desk/dist/
          if-no-files-found: error

  desk-feed:
    name: Lode Desk update feed
    needs: [desk, release]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # The feed is written by the app's own code (`examples/feed.rs`), which links the window.
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev
      - uses: actions/download-artifact@v4
        with:
          pattern: lode-desk-*
          path: desk
          merge-multiple: true
      - name: Checksums
        working-directory: desk
        run: |
          for f in lode-desk-*; do case "$f" in *.sig) ;; *) sha256sum "$f" > "$f.sha256" ;; esac; done
          cat *.sha256
      - name: Write and check the feed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="${GITHUB_REF_NAME#lode-v}"
            gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json body -q .body > notes.md
          else
            version="$(sed -n 's/^version = "\(.*\)"$/\1/p' lode/crates/lode-desk/Cargo.toml | head -n 1)"
            echo "Test build ${GITHUB_SHA::7}" > notes.md
          fi
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME"
          if ls desk/*.sig > /dev/null 2>&1; then
            (cd lode/crates/lode-desk && cargo run --quiet --locked --example feed -- \
              "$GITHUB_WORKSPACE/desk" "$version" "$base" "$GITHUB_WORKSPACE/notes.md") > desk/latest.json
            pipx run check-jsonschema --schemafile lode/crates/lode-desk/packaging/feed.schema.json desk/latest.json
            cat desk/latest.json
          else
            echo "::warning::No signed bundles, so no update feed"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: lode-desk-release
          path: desk/
      - name: Attach to the release and publish the feed
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: desk
        run: |
          files=$(ls lode-desk-* | grep -v '\.sig$')
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" $files
          if [ -f latest.json ]; then
            # The app reads the feed from one fixed release, so a release of another product
            # never hides it.
            gh release view lode-desk-feed --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 ||
              gh release create lode-desk-feed --repo "$GITHUB_REPOSITORY" --latest=false \
                --title "Lode Desk update feed" --notes "latest.json for Lode Desk's update check."
            gh release upload lode-desk-feed --repo "$GITHUB_REPOSITORY" --clobber latest.json
          fi

  image:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lode
    steps:
      - uses: actions/checkout@v4
      - name: Build, test and push the loded image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          owner=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          version="${GITHUB_REF_NAME#lode-v}"
          image="ghcr.io/$owner/loded"
          docker build -t "$image:$version" -t "$image:latest" .
          packaging/docker/smoke.sh "$image:$version"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$image:$version"
          docker push "$image:latest"
