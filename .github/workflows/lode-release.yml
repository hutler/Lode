name: lode-release

# Builds `lode` and `loded` for every supported platform, with checksums, plus the server
# packages (.deb and .rpm for Linux, an MSI for Windows; each is installed, started and removed
# here first) and the Lode Desk bundles with their update feed, and publishes them as a GitHub
# release when a tag `lode-v<version>` is pushed. A manual run builds the same
# archives and keeps them as workflow artifacts without releasing anything.

on:
  push:
    tags: ["lode-v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: lode
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          # Static musl binaries, built in cross's containers (C dependencies included).
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest, cross: true }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-latest, cross: true }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: aarch64-apple-darwin, os: macos-latest }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: taiki-e/install-action@v2
        if: matrix.cross
        with:
          tool: cross
      - name: Build
        env:
          # No Visual C++ runtime needed on the target machine.
          RUSTFLAGS: ${{ contains(matrix.target, 'windows') && '-C target-feature=+crt-static' || '' }}
        run: |
          tool=cargo
          if [ "${{ matrix.cross }}" = "true" ]; then tool=cross; fi
          $tool build --release --locked --target ${{ matrix.target }} -p lode-cli -p loded
      - name: Package
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="${GITHUB_REF_NAME#lode-v}"
          else
            version="dev-${GITHUB_SHA::7}"
          fi
          target=${{ matrix.target }}
          name="lode-$version-$target"
          ext=""
          case "$target" in *windows*) ext=".exe" ;; esac
          mkdir -p "dist/$name"
          cp "target/$target/release/lode$ext" "target/$target/release/loded$ext" \
             LICENSE README.md "dist/$name/"
          cp -R packaging "dist/$name/packaging"
          cd dist
          if [ -n "$ext" ]; then
            7z a -tzip "$name.zip" "$name" > /dev/null
            archive="$name.zip"
          else
            tar czf "$name.tar.gz" "$name"
            archive="$name.tar.gz"
          fi
          if command -v sha256sum > /dev/null; then
            sha256sum "$archive" > "$archive.sha256"
          else
            shasum -a 256 "$archive" > "$archive.sha256"
          fi
          cat "$archive.sha256"
          # The bare client executable, which `lode self-update` downloads.
          cp "../target/$target/release/lode$ext" "lode-$version-$target$ext"
          if command -v sha256sum > /dev/null; then
            sha256sum "lode-$version-$target$ext" > "lode-$version-$target$ext.sha256"
          else
            shasum -a 256 "lode-$version-$target$ext" > "lode-$version-$target$ext.sha256"
          fi
      - uses: actions/setup-go@v5
        if: contains(matrix.target, 'linux')
        with:
          go-version: stable
          cache: false
      - name: Linux packages (.deb, .rpm)
        if: contains(matrix.target, 'linux')
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.49.0
          cargo_version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="${GITHUB_REF_NAME#lode-v}"
          else
            version="$cargo_version-dev.${GITHUB_SHA::7}"
          fi
          case "${{ matrix.target }}" in
            x86_64-*) deb_arch=amd64; rpm_arch=x86_64 ;;
            aarch64-*) deb_arch=arm64; rpm_arch=aarch64 ;;
          esac
          export VERSION="$version" BIN="target/${{ matrix.target }}/release"
          for p in lode-server lode; do
            ARCH=$deb_arch "$(go env GOPATH)/bin/nfpm" package -f "packaging/linux/$p.yaml" -p deb \
              -t "dist/${p}_${version}_${deb_arch}.deb"
            ARCH=$deb_arch "$(go env GOPATH)/bin/nfpm" package -f "packaging/linux/$p.yaml" -p rpm \
              -t "dist/${p}-${version}.${rpm_arch}.rpm"
          done
          cd dist
          for f in *.deb *.rpm; do sha256sum "$f" > "$f.sha256"; done
      - name: Windows installer (.msi)
        if: contains(matrix.target, 'windows')
        run: |
          dotnet tool install --global wix --version 5.0.2
          export PATH="$PATH:$HOME/.dotnet/tools"
          wix extension add --global WixToolset.UI.wixext/5.0.2
          wix extension add --global WixToolset.Util.wixext/5.0.2
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="${GITHUB_REF_NAME#lode-v}"
          else
            version="dev-${GITHUB_SHA::7}"
          fi
          # MSI versions are numbers only: the Cargo version.
          msi_version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          msi="dist/lode-server-$version-x64.msi"
          wix build packaging/windows/lode-server.wxs -arch x64 \
            -ext WixToolset.UI.wixext -ext WixToolset.Util.wixext \
            -d Version="$msi_version" -d BinDir="target/${{ matrix.target }}/release" -o "$msi"
          client="dist/lode-$version-x64.msi"
          wix build packaging/windows/lode.wxs -arch x64 -ext WixToolset.UI.wixext \
            -d Version="$msi_version" -d BinDir="target/${{ matrix.target }}/release" -o "$client"
          rm -f dist/*.wixpdb
          cd dist
          for f in *.msi; do sha256sum "$f" > "$f.sha256"; done
      - name: Install, start and uninstall the MSI
        if: contains(matrix.target, 'windows')
        shell: pwsh
        run: |
          ./packaging/windows/test-msi.ps1 (Get-ChildItem dist/lode-server-*.msi).FullName
          ./packaging/windows/test-client-msi.ps1 `
            (Get-ChildItem dist/lode-*-x64.msi -Exclude lode-server-*).FullName `
            (Get-ChildItem dist/lode-server-*.msi).FullName
      - uses: actions/upload-artifact@v4
        with:
          name: lode-${{ matrix.target }}
          path: |
            lode/dist/*.tar.gz
            lode/dist/*.zip
            lode/dist/*.deb
            lode/dist/*.rpm
            lode/dist/*.msi
            lode/dist/lode-*-unknown-linux-musl
            lode/dist/lode-*-apple-darwin
            lode/dist/lode-*-pc-windows-msvc.exe
            lode/dist/*.sha256
          if-no-files-found: error

  packages:
    name: packages on ${{ matrix.image }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ["debian:bookworm", "ubuntu:24.04", "rockylinux:9", "fedora:41"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: lode-x86_64-unknown-linux-musl
          path: lode/dist
      - name: Install, start and remove the .deb or .rpm
        working-directory: lode
        run: |
          cat dist/*.sha256 | sed 's/ \*/  /' > dist/SHA256SUMS
          docker run --rm -v "$PWD:/src" -w /src "${{ matrix.image }}" \
            packaging/linux/test-package.sh dist

  release:
    needs: [build, packages]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          # The CLI and server builds only; Lode Desk's are attached by desk-feed.
          pattern: lode-{x86_64,aarch64}-*
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: |
          cat *.sha256 | sed 's/ \*/  /' > SHA256SUMS
          sha256sum -c SHA256SUMS
          cat SHA256SUMS
      - uses: actions/checkout@v4
        with:
          path: src
      - name: winget and Homebrew manifests
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="${GITHUB_REF_NAME#lode-v}"
          else
            version="dev-${GITHUB_SHA::7}"
          fi
          src/lode/packaging/render-manifests.sh "$version" dist/SHA256SUMS manifests
      - uses: actions/upload-artifact@v4
        with:
          name: lode-release
          path: |
            dist/
            manifests/
      - name: Publish the release
        if: github.ref_type == 'tag'
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "Lode ${GITHUB_REF_NAME#lode-v}" --generate-notes \
            ./*.tar.gz ./*.zip ./*.deb ./*.rpm ./*.msi \
            ./lode-*-unknown-linux-musl ./lode-*-apple-darwin ./lode-*-pc-windows-msvc.exe SHA256SUMS

  # Lode Desk: every bundle built on its own system, the Linux ones installed here, the update
  # feed written and checked, and (for a tag) all of it attached to the release.
  desk:
    name: Lode Desk on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: lode/crates/lode-desk
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, bundles: "deb,rpm,appimage", platform: linux-x86_64 }
          - { os: windows-latest, bundles: "msi,nsis", platform: windows-x86_64 }
          - { os: macos-latest, bundles: "app,dmg", platform: macos-universal, args: "--target universal-apple-darwin" }
    env:
      # The update key: the private half is a secret, the public half a repository variable.
      # Without them the bundles are built unsigned and the app never offers updates.
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.LODE_DESK_UPDATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.LODE_DESK_UPDATE_KEY_PASSWORD }}
      UPDATE_PUBKEY: ${{ vars.LODE_DESK_UPDATE_PUBKEY }}
      HAS_WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE != '' }}
      HAS_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: lode/crates/lode-desk/ui/package-lock.json
      - name: Install the system web view (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libsoup-3.0-dev rpm
      - run: npm ci
        working-directory: lode/crates/lode-desk/ui
      - name: Feed script tests
        if: runner.os == 'Linux'
        run: node --test packaging/feed.test.mjs
      # Code signing is wired but off until the project has certificates: each part runs only
      # when its secrets are set.
      - name: Windows code signing certificate
        if: runner.os == 'Windows' && env.HAS_WINDOWS_CERTIFICATE == 'true'
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP cert.pfx
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $pw = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $pw
          "WINDOWS_THUMBPRINT=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: macOS code signing and notarization
        if: runner.os == 'macOS' && env.HAS_APPLE_CERTIFICATE == 'true'
        run: |
          {
            echo "APPLE_CERTIFICATE=${{ secrets.APPLE_CERTIFICATE }}"
            echo "APPLE_CERTIFICATE_PASSWORD=${{ secrets.APPLE_CERTIFICATE_PASSWORD }}"
            echo "APPLE_SIGNING_IDENTITY=${{ secrets.APPLE_SIGNING_IDENTITY }}"
            echo "APPLE_ID=${{ secrets.APPLE_ID }}"
            echo "APPLE_PASSWORD=${{ secrets.APPLE_PASSWORD }}"
            echo "APPLE_TEAM_ID=${{ secrets.APPLE_TEAM_ID }}"
          } >> "$GITHUB_ENV"
      - name: Build the bundles
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="${GITHUB_REF_NAME#lode-v}"
          else
            version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          config=$(jq -nc --arg v "$version" '{version: $v}')
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            if [ -z "$UPDATE_PUBKEY" ]; then
              echo "::error::LODE_DESK_UPDATE_KEY is set but the LODE_DESK_UPDATE_PUBKEY variable is not"
              exit 1
            fi
            config=$(jq -c --arg k "$UPDATE_PUBKEY" \
              '.bundle.createUpdaterArtifacts = true | .plugins.updater.pubkey = $k' <<< "$config")
          else
            echo "::warning::No update key: the bundles are not signed for updates and never offer one"
            unset TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD
          fi
          if [ -n "${WINDOWS_THUMBPRINT:-}" ]; then
            config=$(jq -c --arg t "$WINDOWS_THUMBPRINT" '.bundle.windows.certificateThumbprint = $t' <<< "$config")
          fi
          ./ui/node_modules/.bin/tauri build --ci --features web --bundles ${{ matrix.bundles }} ${{ matrix.args }} --config "$config"
      - name: Collect the bundles
        run: |
          mkdir -p dist
          out=target/release/bundle
          [ -d target/universal-apple-darwin ] && out=target/universal-apple-darwin/release/bundle
          name="lode-desk-$VERSION-${{ matrix.platform }}"
          take() { # take SOURCE_GLOB TARGET_NAME: copies one bundle and its signature, if any
            for f in $1; do
              [ -f "$f" ] || continue
              cp "$f" "dist/$2"
              [ -f "$f.sig" ] && cp "$f.sig" "dist/$2.sig"
            done
          }
          take "$out/appimage/*.AppImage" "$name.AppImage"
          take "$out/deb/*.deb" "$name.deb"
          take "$out/rpm/*.rpm" "$name.rpm"
          take "$out/msi/*.msi" "$name.msi"
          take "$out/nsis/*-setup.exe" "$name-setup.exe"
          take "$out/dmg/*.dmg" "$name.dmg"
          take "$out/macos/*.app.tar.gz" "$name.app.tar.gz"
          ls -l dist
          [ -n "$(ls dist)" ] || { echo "::error::no bundles were built"; exit 1; }
      - name: Install the .deb and check it
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y ./dist/lode-desk-*.deb
          desktop=$(dpkg -L lode-desk | grep '\.desktop$')
          grep -q 'x-scheme-handler/lode' "$desktop"
          bin=$(dpkg -L lode-desk | grep '/bin/' | head -n 1)
          ! ldd "$bin" | grep 'not found'
          sudo apt-get remove -y lode-desk
      - name: Install the .rpm on Fedora and check it
        if: runner.os == 'Linux'
        run: |
          docker run --rm -v "$PWD/dist:/dist" fedora:41 sh -euc '
            dnf install -y /dist/lode-desk-*.rpm
            grep -q "x-scheme-handler/lode" "$(rpm -ql lode-desk | grep "\.desktop$")"
            ! ldd $(rpm -ql lode-desk | grep "/bin/" | head -n 1) | grep "not found"
            dnf remove -y lode-desk'
      - name: Check the AppImage
        if: runner.os == 'Linux'
        run: |
          appimage=$(ls dist/*.AppImage)
          chmod +x "$appimage"
          (cd "$RUNNER_TEMP" && "$GITHUB_WORKSPACE/lode/crates/lode-desk/$appimage" --appimage-extract > /dev/null)
          grep -q 'x-scheme-handler/lode' "$RUNNER_TEMP"/squashfs-root/*.desktop
      - uses: actions/upload-artifact@v4
        with:
          name: lode-desk-${{ matrix.platform }}
          path: lode/crates/lode-desk/dist/
          if-no-files-found: error

  desk-feed:
    name: Lode Desk update feed
    needs: [desk, release]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: lode-desk-*
          path: desk
          merge-multiple: true
      - name: Checksums
        working-directory: desk
        run: |
          for f in lode-desk-*; do case "$f" in *.sig) ;; *) sha256sum "$f" > "$f.sha256" ;; esac; done
          cat *.sha256
      - name: Write and check the feed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="${GITHUB_REF_NAME#lode-v}"
            gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json body -q .body > notes.md
          else
            version="$(sed -n 's/^version = "\(.*\)"$/\1/p' lode/crates/lode-desk/Cargo.toml | head -n 1)"
            echo "Test build ${GITHUB_SHA::7}" > notes.md
          fi
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME"
          if ls desk/*.sig > /dev/null 2>&1; then
            node lode/crates/lode-desk/packaging/feed.mjs desk "$version" "$base" notes.md > desk/latest.json
            pipx run check-jsonschema --schemafile lode/crates/lode-desk/packaging/feed.schema.json desk/latest.json
            cat desk/latest.json
          else
            echo "::warning::No signed bundles, so no update feed"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: lode-desk-release
          path: desk/
      - name: Attach to the release and publish the feed
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: desk
        run: |
          files=$(ls lode-desk-* | grep -v '\.sig$')
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" $files
          if [ -f latest.json ]; then
            # The app reads the feed from one fixed release, so a release of another product
            # never hides it.
            gh release view lode-desk-feed --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 ||
              gh release create lode-desk-feed --repo "$GITHUB_REPOSITORY" --latest=false \
                --title "Lode Desk update feed" --notes "latest.json for Lode Desk's update check."
            gh release upload lode-desk-feed --repo "$GITHUB_REPOSITORY" --clobber latest.json
          fi

  image:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lode
    steps:
      - uses: actions/checkout@v4
      - name: Build, test and push the loded image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          owner=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          version="${GITHUB_REF_NAME#lode-v}"
          image="ghcr.io/$owner/loded"
          docker build -t "$image:$version" -t "$image:latest" .
          packaging/docker/smoke.sh "$image:$version"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$image:$version"
          docker push "$image:latest"
