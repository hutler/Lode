name: desk-release

# Lode Desk's installers for every system, each built there by cargo-packager (the Linux ones
# and the MSI installed and checked here), the update feed written and checked, and for a tag
# `desk-v<version>` all of it published as the GitHub release "Lode Desk <version>" with the
# feed in the fixed release `lode-desk-feed`. A manual run builds the same files and keeps them
# as workflow artifacts without releasing anything. The Lode programs have their own release
# (`lode-release.yml`, tags `lode-v*`); Desk's version is its own, in desk/Cargo.toml.

on:
  push:
    tags: ["desk-v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  desk:
    name: Lode Desk on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desk
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, formats: "deb,appimage", platform: linux-x86_64 }
          - { os: windows-latest, formats: "wix,nsis", platform: windows-x86_64 }
          - { os: macos-latest, formats: "app,dmg", platform: macos-universal }
    env:
      # The update key: the private half is a secret, the public half a repository variable
      # that the build puts into the app. Without them the installers are not signed for
      # updates and the app never offers one.
      CARGO_PACKAGER_SIGN_PRIVATE_KEY: ${{ secrets.LODE_DESK_UPDATE_KEY }}
      CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD: ${{ secrets.LODE_DESK_UPDATE_KEY_PASSWORD }}
      LODE_DESK_UPDATE_PUBKEY: ${{ vars.LODE_DESK_UPDATE_PUBKEY }}
      HAS_WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE != '' }}
      HAS_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-packager@0.11.8
      - name: System libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev
      - name: Version and update key
        run: |
          own="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="${GITHUB_REF_NAME#desk-v}"
            if [ "$version" != "$own" ]; then
              echo "::error::the tag says $version but desk/Cargo.toml says $own: set version there to the tag's"
              exit 1
            fi
          else
            version="$own"
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          # The package's own version (the first `version =`), and its entry in the lock file.
          perl -0pi -e 's/^version = "[^"]*"/version = "'"$version"'"/m' Cargo.toml
          perl -0pi -e 's/(name = "lode-desk"\nversion = )"[^"]*"/$1"'"$version"'"/' Cargo.lock
          if [ -n "$CARGO_PACKAGER_SIGN_PRIVATE_KEY" ]; then
            if [ -z "$LODE_DESK_UPDATE_PUBKEY" ]; then
              echo "::error::LODE_DESK_UPDATE_KEY is set but the LODE_DESK_UPDATE_PUBKEY variable is not"
              exit 1
            fi
          else
            echo "::warning::No update key: the installers are not signed for updates and never offer one"
            echo "LODE_DESK_UPDATE_PUBKEY=" >> "$GITHUB_ENV"
          fi
      # Code signing is wired but off until the project has certificates: each part runs only
      # when its secrets are set.
      - name: Windows code signing certificate
        if: runner.os == 'Windows' && env.HAS_WINDOWS_CERTIFICATE == 'true'
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP cert.pfx
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $pw = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $pw
          "`n[package.metadata.packager.windows]`ncertificate-thumbprint = `"$($cert.Thumbprint)`"`ntimestamp-url = `"http://timestamp.digicert.com`"" | Add-Content Cargo.toml
      - name: macOS code signing and notarization
        if: runner.os == 'macOS' && env.HAS_APPLE_CERTIFICATE == 'true'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          {
            echo "APPLE_CERTIFICATE=${{ secrets.APPLE_CERTIFICATE }}"
            echo "APPLE_CERTIFICATE_PASSWORD=${{ secrets.APPLE_CERTIFICATE_PASSWORD }}"
            echo "APPLE_ID=${{ secrets.APPLE_ID }}"
            echo "APPLE_PASSWORD=${{ secrets.APPLE_PASSWORD }}"
            echo "APPLE_TEAM_ID=${{ secrets.APPLE_TEAM_ID }}"
          } >> "$GITHUB_ENV"
          perl -0pi -e 's/(\[package\.metadata\.packager\.macos\]\n)/$1signing-identity = "$ENV{APPLE_SIGNING_IDENTITY}"\n/' Cargo.toml
      - name: Build the app
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            # One program for Intel and Apple silicon.
            cargo build --release --locked --target aarch64-apple-darwin
            cargo build --release --locked --target x86_64-apple-darwin
            mkdir -p target/universal/release
            lipo -create -output target/universal/release/lode-desk \
              target/aarch64-apple-darwin/release/lode-desk target/x86_64-apple-darwin/release/lode-desk
            # `cargo packager --release` takes the program from target/release whatever
            # --binaries-dir says, so the universal one goes there too.
            mkdir -p target/release
            cp target/universal/release/lode-desk target/release/lode-desk
            echo "BINARIES=target/universal/release" >> "$GITHUB_ENV"
          else
            cargo build --release --locked
            echo "BINARIES=target/release" >> "$GITHUB_ENV"
          fi
      - name: Installers
        run: |
          cargo packager --release --formats ${{ matrix.formats }} \
            --binaries-dir "$BINARIES" --out-dir target/packages
          ls -l target/packages
      - name: Collect the installers
        run: |
          mkdir -p dist
          name="lode-desk-$VERSION-${{ matrix.platform }}"
          take() { # take SOURCE_GLOB TARGET_NAME: copies one installer and its signature, if any
            for f in $1; do
              [ -f "$f" ] || continue
              cp "$f" "dist/$2"
              [ -f "$f.sig" ] && cp "$f.sig" "dist/$2.sig"
            done
          }
          out=target/packages
          take "$out/*.AppImage" "$name.AppImage"
          take "$out/*.deb" "$name.deb"
          take "$out/*.msi" "$name.msi"
          take "$out/*-setup.exe" "$name-setup.exe"
          take "$out/*.dmg" "$name.dmg"
          take "$out/*.app.tar.gz" "$name.app.tar.gz"
          ls -l dist
          [ -n "$(ls dist)" ] || { echo "::error::no installers were built"; exit 1; }
      - name: Install the .deb and check it
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y ./dist/lode-desk-*.deb
          desktop=$(dpkg -L lode-desk | grep '\.desktop$')
          grep -q 'x-scheme-handler/lode' "$desktop"
          bin=$(dpkg -L lode-desk | grep '/bin/' | head -n 1)
          ! ldd "$bin" | grep 'not found'
          sudo apt-get remove -y lode-desk
      - name: Check the AppImage
        if: runner.os == 'Linux'
        run: |
          appimage=$(ls dist/*.AppImage)
          chmod +x "$appimage"
          (cd "$RUNNER_TEMP" && "$GITHUB_WORKSPACE/desk/$appimage" --appimage-extract > /dev/null)
          grep -q 'x-scheme-handler/lode' "$RUNNER_TEMP"/squashfs-root/*.desktop
      - name: Install the MSI and check that it registers lode links
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $msi = (Get-ChildItem dist/*.msi).FullName
          $p = Start-Process msiexec.exe -ArgumentList "/i `"$msi`" /qn /norestart" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "msiexec exited with $($p.ExitCode)" }
          $cmd = (Get-ItemProperty "Registry::HKEY_CLASSES_ROOT\lode\shell\open\command").'(default)'
          Write-Output "lode:// opens: $cmd"
          # The installer may write the short (8.3) form of the path; the file's own name is
          # the long one.
          $exe = ($cmd -split '"')[1]
          if (-not $exe -or -not (Test-Path -LiteralPath $exe)) { throw "the lode scheme names no program: $cmd" }
          Add-Type -Namespace Win32 -Name Paths -MemberDefinition '[DllImport("kernel32.dll", CharSet = CharSet.Unicode)] public static extern uint GetLongPathName(string shortPath, System.Text.StringBuilder longPath, uint size);'
          $sb = New-Object System.Text.StringBuilder 1024
          if ([Win32.Paths]::GetLongPathName($exe, $sb, 1024) -eq 0) { throw "cannot read the long form of $exe" }
          $long = $sb.ToString()
          Write-Output "that is: $long"
          if ((Split-Path -Leaf $long) -ne 'lode-desk.exe') { throw "the lode scheme does not open lode-desk.exe: $cmd" }
          $p = Start-Process msiexec.exe -ArgumentList "/x `"$msi`" /qn /norestart" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "uninstall exited with $($p.ExitCode)" }
      - uses: actions/upload-artifact@v4
        with:
          name: lode-desk-${{ matrix.platform }}
          path: desk/dist/
          if-no-files-found: error

  desk-feed:
    name: Lode Desk release and update feed
    needs: [desk]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # The feed is written by the app's own code (`examples/feed.rs`), which links the window.
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev
      - uses: actions/download-artifact@v4
        with:
          pattern: lode-desk-*
          path: desk
          merge-multiple: true
      - name: Checksums
        working-directory: desk
        run: |
          for f in lode-desk-*; do case "$f" in *.sig) ;; *) sha256sum "$f" > "$f.sha256" ;; esac; done
          cat *.sha256
      - name: Write and check the feed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="${GITHUB_REF_NAME#desk-v}"
            # The release first (its generated notes are the feed's What's new), not yet
            # marked latest: the CLI and server releases stay the repository's latest.
            gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 ||
              gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --latest=false \
                --title "Lode Desk $version" --generate-notes
            gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json body -q .body > notes.md
          else
            version="$(sed -n 's/^version = "\(.*\)"$/\1/p' desk/Cargo.toml | head -n 1)"
            echo "Test build ${GITHUB_SHA::7}" > notes.md
          fi
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME"
          if ls desk/*.sig > /dev/null 2>&1; then
            (cd desk && cargo run --quiet --locked --example feed -- \
              "$GITHUB_WORKSPACE/desk" "$version" "$base" "$GITHUB_WORKSPACE/notes.md") > desk/latest.json
            pipx run check-jsonschema --schemafile desk/packaging/feed.schema.json desk/latest.json
            cat desk/latest.json
          else
            echo "::warning::No signed bundles, so no update feed"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: lode-desk-release
          path: desk/
      - name: Attach to the release and publish the feed
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: desk
        run: |
          files=$(ls lode-desk-* | grep -v '\.sig$')
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" $files
          if [ -f latest.json ]; then
            # The app reads the feed from one fixed release, so a release of another product
            # never hides it.
            gh release view lode-desk-feed --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 ||
              gh release create lode-desk-feed --repo "$GITHUB_REPOSITORY" --latest=false \
                --title "Lode Desk update feed" --notes "latest.json for Lode Desk's update check."
            gh release upload lode-desk-feed --repo "$GITHUB_REPOSITORY" --clobber latest.json
          fi
