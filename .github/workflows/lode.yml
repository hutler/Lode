name: lode

on:
  push:
    branches: [main]
    paths: ["lode/**", ".github/workflows/lode.yml"]
  pull_request:
    paths: ["lode/**", ".github/workflows/lode.yml"]

defaults:
  run:
    working-directory: lode

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: lode
      # Pebble, the ACME test server, for the built-in TLS test (lode-server tests/acme.rs).
      - uses: actions/setup-go@v5
        if: runner.os == 'Linux'
        with:
          go-version: stable
          cache: false
      - name: Install Pebble
        if: runner.os == 'Linux'
        run: |
          go install github.com/letsencrypt/pebble/v2/cmd/pebble@v2.10.3 \
            github.com/letsencrypt/pebble/v2/cmd/pebble-challtestsrv@v2.10.3
          echo "PEBBLE=$(go env GOPATH)/bin/pebble" >> "$GITHUB_ENV"
          echo "PEBBLE_CHALLTESTSRV=$(go env GOPATH)/bin/pebble-challtestsrv" >> "$GITHUB_ENV"
      # Subversion, for the SVN import test (lode-cli tests/import_svn.rs); skipped without it.
      - name: Install Subversion
        if: runner.os != 'Windows'
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then sudo apt-get install -y subversion; else brew install subversion; fi
      # MinIO, so the blob store tests also run against a real S3 service
      # (lode-store tests/store.rs, module real_s3); skipped without LODE_TEST_S3.
      - name: Start MinIO
        if: runner.os == 'Linux'
        run: |
          docker run -d --name minio -p 127.0.0.1:9000:9000 \
            -e MINIO_ROOT_USER=lodeci -e MINIO_ROOT_PASSWORD=lodeci-secret-key \
            minio/minio:RELEASE.2025-04-22T22-12-26Z server /data
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:9000/minio/health/live && break
            sleep 1
          done
          echo "LODE_TEST_S3=http://lodeci:lodeci-secret-key@127.0.0.1:9000/lode-ci" >> "$GITHUB_ENV"
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  msrv:
    name: minimum Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Keep in step with `rust-version` in lode/Cargo.toml.
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: lode
      - run: cargo check --workspace --all-targets --locked

  container:
    name: container smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t loded:smoke .
      - run: packaging/docker/smoke.sh loded:smoke

  desk:
    name: Lode Desk (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: lode/crates/lode-desk
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: lode/crates/lode-desk
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: lode/crates/lode-desk/ui/package-lock.json
      - name: Install the system web view (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libsoup-3.0-dev libfontconfig1-dev libxkbcommon-dev
      - run: npm ci
        working-directory: lode/crates/lode-desk/ui
      - run: npm test
        working-directory: lode/crates/lode-desk/ui
      - run: node --test packaging/feed.test.mjs
      - run: npm run build
        working-directory: lode/crates/lode-desk/ui
      - run: cargo fmt --check
      # The Slint window (default) and the Tauri window (feature `web`, until T135).
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo clippy --all-targets --features web-test -- -D warnings
      - run: cargo test
      - run: cargo test --features web-test --test update
      # The Slint screens, light and dark, for visual review.
      - run: cargo run --example screenshots -- target/screenshots
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: lode-desk-slint-screenshots
          path: lode/crates/lode-desk/target/screenshots/
      # Screens of the app against the mocked backend, light and dark, for visual review.
      - name: Screenshots
        if: runner.os == 'Linux'
        working-directory: lode/crates/lode-desk/ui
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          npm run screenshots
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: lode-desk-screenshots
          path: lode/crates/lode-desk/ui/screenshots/
