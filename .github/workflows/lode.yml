name: lode

on:
  push:
    branches: [main]
    paths: ["lode/**", ".github/workflows/lode.yml"]
  pull_request:
    paths: ["lode/**", ".github/workflows/lode.yml"]

defaults:
  run:
    working-directory: lode

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: lode
      # Pebble, the ACME test server, for the built-in TLS test (lode-server tests/acme.rs).
      - uses: actions/setup-go@v5
        if: runner.os == 'Linux'
        with:
          go-version: stable
          cache: false
      - name: Install Pebble
        if: runner.os == 'Linux'
        run: |
          go install github.com/letsencrypt/pebble/v2/cmd/pebble@v2.10.3 \
            github.com/letsencrypt/pebble/v2/cmd/pebble-challtestsrv@v2.10.3
          echo "PEBBLE=$(go env GOPATH)/bin/pebble" >> "$GITHUB_ENV"
          echo "PEBBLE_CHALLTESTSRV=$(go env GOPATH)/bin/pebble-challtestsrv" >> "$GITHUB_ENV"
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  msrv:
    name: minimum Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Keep in step with `rust-version` in lode/Cargo.toml.
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: lode
      - run: cargo check --workspace --all-targets --locked

  container:
    name: container smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t loded:smoke .
      - run: packaging/docker/smoke.sh loded:smoke
