name: lode

on:
  push:
    branches: [main]
    paths: ["lode/**", ".github/workflows/lode.yml"]
  pull_request:
    paths: ["lode/**", ".github/workflows/lode.yml"]

defaults:
  run:
    working-directory: lode

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: lode
      # Pebble, the ACME test server, for the built-in TLS test (lode-server tests/acme.rs).
      - uses: actions/setup-go@v5
        if: runner.os == 'Linux'
        with:
          go-version: stable
          cache: false
      - name: Install Pebble
        if: runner.os == 'Linux'
        run: |
          go install github.com/letsencrypt/pebble/v2/cmd/pebble@v2.10.3 \
            github.com/letsencrypt/pebble/v2/cmd/pebble-challtestsrv@v2.10.3
          echo "PEBBLE=$(go env GOPATH)/bin/pebble" >> "$GITHUB_ENV"
          echo "PEBBLE_CHALLTESTSRV=$(go env GOPATH)/bin/pebble-challtestsrv" >> "$GITHUB_ENV"
      # Subversion, for the SVN import test (lode-cli tests/import_svn.rs); skipped without it.
      - name: Install Subversion
        if: runner.os != 'Windows'
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then sudo apt-get install -y subversion; else brew install subversion; fi
      # MinIO, so the blob store tests also run against a real S3 service
      # (lode-store tests/store.rs, module real_s3); skipped without LODE_TEST_S3.
      - name: Start MinIO
        if: runner.os == 'Linux'
        run: |
          # MinIO no longer publishes images or binaries, so it is built from a pinned commit.
          go install github.com/minio/minio@v0.0.0-20260212201848-7aac2a2c5b7c
          mkdir -p "$RUNNER_TEMP/minio-data"
          MINIO_ROOT_USER=lodeci MINIO_ROOT_PASSWORD=lodeci-secret-key \
            nohup "$(go env GOPATH)/bin/minio" server "$RUNNER_TEMP/minio-data" \
            --address 127.0.0.1:9000 > "$RUNNER_TEMP/minio.log" 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:9000/minio/health/live && break
            sleep 1
          done
          echo "LODE_TEST_S3=http://lodeci:lodeci-secret-key@127.0.0.1:9000/lode-ci" >> "$GITHUB_ENV"
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  msrv:
    name: minimum Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Keep in step with `rust-version` in lode/Cargo.toml.
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: lode
      - run: cargo check --workspace --all-targets --locked

  container:
    name: container smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t loded:smoke .
      - run: packaging/docker/smoke.sh loded:smoke

  desk:
    name: Lode Desk (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: lode/crates/lode-desk
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: lode/crates/lode-desk
      - name: System libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      # The Slint screens, light and dark, for visual review.
      - run: cargo run --example screenshots -- target/screenshots
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: lode-desk-slint-screenshots
          path: lode/crates/lode-desk/target/screenshots/
