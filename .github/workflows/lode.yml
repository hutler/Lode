name: lode

on:
  push:
    branches: [main]
    paths: ["lode/**", ".github/workflows/lode.yml"]
  pull_request:
    paths: ["lode/**", ".github/workflows/lode.yml"]

defaults:
  run:
    working-directory: lode

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: lode
      # Pebble, the ACME test server, for the built-in TLS test (lode-server tests/acme.rs).
      - uses: actions/setup-go@v5
        if: runner.os == 'Linux'
        with:
          go-version: stable
          cache: false
      - name: Install Pebble
        if: runner.os == 'Linux'
        run: |
          go install github.com/letsencrypt/pebble/v2/cmd/pebble@v2.10.3 \
            github.com/letsencrypt/pebble/v2/cmd/pebble-challtestsrv@v2.10.3
          echo "PEBBLE=$(go env GOPATH)/bin/pebble" >> "$GITHUB_ENV"
          echo "PEBBLE_CHALLTESTSRV=$(go env GOPATH)/bin/pebble-challtestsrv" >> "$GITHUB_ENV"
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  msrv:
    name: minimum Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Keep in step with `rust-version` in lode/Cargo.toml.
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: lode
      - run: cargo check --workspace --all-targets --locked

  container:
    name: container smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t loded:smoke .
      - run: packaging/docker/smoke.sh loded:smoke

  desk:
    name: Lode Desk (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: lode/crates/lode-desk
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: lode/crates/lode-desk
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: lode/crates/lode-desk/ui/package-lock.json
      - name: Install the system web view (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libsoup-3.0-dev
      - run: npm ci
        working-directory: lode/crates/lode-desk/ui
      - run: npm test
        working-directory: lode/crates/lode-desk/ui
      - run: npm run build
        working-directory: lode/crates/lode-desk/ui
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      # Screens of the app against the mocked backend, light and dark, for visual review.
      - name: Screenshots
        if: runner.os == 'Linux'
        working-directory: lode/crates/lode-desk/ui
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          npm run screenshots
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: lode-desk-screenshots
          path: lode/crates/lode-desk/ui/screenshots/
