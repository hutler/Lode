[package]
name = "lode-desk"
description = "Lode Desk, the Lode desktop client"
version = "0.3.0"
edition = "2021"
license = "Apache-2.0"
# Slint 1.18 needs 1.92; the rest of Lode stays on 1.88.
rust-version = "1.92"
repository = "https://github.com/hutler/Lode"
publish = false

# The installers, made by cargo-packager (T135): `cargo build --release`, then
# `cargo packager --release` in this folder. The names, identifier and install folders are the
# ones the Tauri bundles had (T114). The release workflow sets the version, picks the formats
# and, when the project has one, passes the update signing key.
[package.metadata.packager]
product-name = "Lode Desk"
identifier = "dev.simpledevops.lode-desk"
description = "The Lode version control desktop client"
long-description = "Lode Desk shows a Lode workspace's changes, history, locks, shelves, branches and view, and runs the same operations as the lode command."
homepage = "https://github.com/hutler/Lode"
publisher = "SimpleDevOps"
authors = ["The SimpleDevOps contributors"]
copyright = "Copyright the SimpleDevOps contributors"
license-file = "../LICENSE"
category = "DeveloperTool"
binaries = [{ path = "lode-desk", main = true }]
icons = ["icons/32x32.png", "icons/128x128.png", "icons/128x128@2x.png", "icons/icon.png", "icons/icon.icns", "icons/icon.ico"]
formats = ["deb", "appimage", "wix", "nsis", "app", "dmg"]

# `lode://` links: registered by every installer (T113).
[[package.metadata.packager.deep-link-protocols]]
schemes = ["lode"]
name = "Lode link"

[package.metadata.packager.deb]
section = "vcs"
# Linked (fontconfig) or loaded when the window opens (xkbcommon); X11 and Wayland come with
# any desktop.
depends = ["libfontconfig1", "libxkbcommon0", "libxkbcommon-x11-0"]
desktop-template = "packaging/lode-desk.desktop"

[package.metadata.packager.wix]
languages = ["en-US"]

[package.metadata.packager.nsis]
installer-mode = "currentUser"

[package.metadata.packager.macos]
minimum-system-version = "11.0"

# Its own workspace: building the CLI and server never needs the window system libraries.
[workspace]

[lib]
name = "lode_desk"

[[bin]]
name = "lode-desk"
path = "src/main.rs"

[lints.rust]
# `deny`, not `forbid`: the code Slint generates for the screens allows itself `unsafe`.
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"

[build-dependencies]
slint-build = "1.18"

# The program's icon and manifest on Windows (T135; before, Tauri's build step embedded them).
[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"

[dependencies]
# The Lode core, at a pinned version (see "The core version" in README.md). Desk moves to a new
# core in its own change: set the same `rev` (or `tag`) on all six lines and run `cargo update`.
lode-client = { git = "https://github.com/hutler/Lode", rev = "6d2cbe0aa4b56f86e291a66df6ace287142ab78b" }
lode-ops = { git = "https://github.com/hutler/Lode", rev = "6d2cbe0aa4b56f86e291a66df6ace287142ab78b" }
lode-core = { git = "https://github.com/hutler/Lode", rev = "6d2cbe0aa4b56f86e291a66df6ace287142ab78b" }
base64 = "0.22"
directories = "6"
# Decodes the two sides of an image diff (Slint takes pixels); already in the tree through rfd.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
# Checks the signature of an update (T135), the same minisign format the Tauri updater used.
minisign-verify = "0.3"
notify = "8.2"
# The token of the single-instance socket (T135); already in the tree through lode-client.
rand = "0.8"
# Downloads the update feed and packages (T135); the workspace's reqwest, through lode-client.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.18"
# Slint under its Royalty-free License 2.0 (desktop apps; the About dialog carries the notice).
slint = { version = "1.18", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-femtovg", "renderer-software", "accessibility"] }
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync"] }

[dev-dependencies]
i-slint-backend-testing = "=1.18.1"
png = "0.17"
lode-proto = { git = "https://github.com/hutler/Lode", rev = "6d2cbe0aa4b56f86e291a66df6ace287142ab78b" }
lode-server = { git = "https://github.com/hutler/Lode", rev = "6d2cbe0aa4b56f86e291a66df6ace287142ab78b" }
lode-testkit = { git = "https://github.com/hutler/Lode", rev = "6d2cbe0aa4b56f86e291a66df6ace287142ab78b" }
minisign = "0.10.0"
tempfile = "3"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "macros", "time"] }

[[test]]
name = "ui"
harness = false

[[example]]
name = "screenshots"

[[example]]
name = "feed"
