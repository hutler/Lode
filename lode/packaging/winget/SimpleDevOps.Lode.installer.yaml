# winget installer manifest of the Lode client. `packaging/render-manifests.sh` fills in the
# placeholders for a release; submit the three rendered files to microsoft/winget-pkgs under
# manifests/s/SimpleDevOps/Lode/<version>/.
PackageIdentifier: SimpleDevOps.Lode
PackageVersion: "{{VERSION}}"
InstallerType: wix
Scope: machine
UpgradeBehavior: install
Commands:
  - lode
Installers:
  - Architecture: x64
    InstallerUrl: https://github.com/hutler/simpledevops/releases/download/lode-v{{VERSION}}/lode-{{VERSION}}-x64.msi
    InstallerSha256: "{{SHA256_lode-{{VERSION}}-x64.msi}}"
ManifestType: installer
ManifestVersion: 1.6.0
