[package]
name = "lode-cli"
description = "The lode command line client"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "lode"
path = "src/main.rs"

[dependencies]
clap.workspace = true
futures.workspace = true
hex.workspace = true
lode-ops.workspace = true
lode-proto.workspace = true
lode-workspace.workspace = true
rmcp = { workspace = true, features = ["server", "transport-io"] }
reqwest.workspace = true
rpassword.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
time.workspace = true
tokio = { workspace = true, features = ["io-std"] }

[dev-dependencies]
assert_cmd.workspace = true
axum.workspace = true
base64.workspace = true
insta.workspace = true
lode-client.workspace = true
lode-core.workspace = true
lode-server.workspace = true
lode-store = { workspace = true, features = ["test-util"] }
lode-testkit.workspace = true
rmcp = { workspace = true, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest"] }
lode-meta.workspace = true
