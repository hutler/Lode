[package]
name = "lode-cli"
description = "The lode command line client"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "lode"
path = "src/main.rs"

[dependencies]
base64.workspace = true
clap.workspace = true
directories.workspace = true
diffy.workspace = true
futures.workspace = true
lode-client.workspace = true
lode-core.workspace = true
lode-proto.workspace = true
lode-workspace.workspace = true
rmcp = { workspace = true, features = ["server", "transport-io"] }
rpassword.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
time.workspace = true
tokio = { workspace = true, features = ["io-std"] }
toml.workspace = true
uuid.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
axum.workspace = true
insta.workspace = true
lode-server.workspace = true
lode-testkit.workspace = true
rmcp = { workspace = true, features = ["client", "transport-child-process"] }
