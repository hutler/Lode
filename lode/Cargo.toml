[workspace]
resolver = "2"
members = [
    "crates/lode-build",
    "crates/lode-core",
    "crates/lode-proto",
    "crates/lode-store",
    "crates/lode-meta",
    "crates/lode-server",
    "crates/lode-mod-locks",
    "crates/lode-mod-shelves",
    "crates/lode-mod-mcp",
    "crates/lode-mod-webhooks",
    "crates/lode-mod-checks",
    "crates/lode-mod-feed",
    "crates/lode-validate",
    "crates/lode-mod-validate",
    "crates/lode-client",
    "crates/lode-proxy",
    "crates/lode-workspace",
    "crates/lode-import",
    "crates/lode-ops",
    "crates/lode-cli",
    "crates/loded",
    "crates/lode-testkit",
]
# Lode Desk is its own workspace, so building the CLI and server never needs the system
# web view libraries.
exclude = ["crates/lode-desk"]

[workspace.package]
version = "0.4.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.88"
repository = "https://github.com/hutler/Lode"
publish = false

[workspace.dependencies]
# Internal crates
lode-build = { path = "crates/lode-build" }
lode-core = { path = "crates/lode-core" }
lode-validate = { path = "crates/lode-validate" }
lode-mod-validate = { path = "crates/lode-mod-validate" }
lode-proto = { path = "crates/lode-proto" }
lode-store = { path = "crates/lode-store" }
lode-meta = { path = "crates/lode-meta" }
lode-server = { path = "crates/lode-server" }
lode-mod-locks = { path = "crates/lode-mod-locks" }
lode-mod-shelves = { path = "crates/lode-mod-shelves" }
lode-mod-mcp = { path = "crates/lode-mod-mcp" }
lode-mod-webhooks = { path = "crates/lode-mod-webhooks" }
lode-mod-checks = { path = "crates/lode-mod-checks" }
lode-mod-feed = { path = "crates/lode-mod-feed" }
lode-client = { path = "crates/lode-client" }
lode-proxy = { path = "crates/lode-proxy" }
lode-workspace = { path = "crates/lode-workspace" }
lode-import = { path = "crates/lode-import" }
lode-ops = { path = "crates/lode-ops" }
lode-testkit = { path = "crates/lode-testkit" }

# Third-party crates (allow-list in AGENTS.md)
anyhow = "1"
argon2 = "0.5"
async-trait = "0.1"
base64 = "0.22"
axum = "0.8"
blake3 = "1"
bytes = "1"
directories = "6"
diffy = { version = "0.5", features = ["std"] }
similar = "2.7"
fs4 = "0.13"
clap = { version = "4", features = ["derive"] }
clap_complete = "4.5"
futures = "0.3"
globset = "0.4"
hex = "0.4"
hmac = "0.12"
# ACME client for built-in Let's Encrypt certificates (T081): ring, its own hyper-rustls client
# with the platform verifier, rcgen for keys and CSRs.
instant-acme = { version = "0.8", default-features = false, features = ["ring", "hyper-rustls", "rcgen"] }
# hyper and its companion hyper-util (already used through axum): the server's own connection
# loop, for header timeouts and per-address limits (T080).
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["server", "server-graceful", "http1", "http2", "tokio"] }
ignore = "0.4"
rand = "0.8"
# Signature checks for single sign-on ID tokens (T122): RS256 and ES256. Already in the tree
# through rustls and instant-acme; used directly instead of a JWT crate.
ring = "0.17"
# The official Rust MCP SDK. 3.x needs Rust 1.88.
rmcp = { version = "3.10", default-features = false }
rpassword = "7"
# Native Windows service for loded (T082); Windows only.
windows-service = "0.8"
# rustls with the ring provider: aws-lc-rs needs extra build tools on Windows.
# reqwest 0.12: 0.13 needs Rust 1.85 and defaults to aws-lc-rs. Native roots with ring, no
# automatic decompression (the client decodes zstd itself so it can verify ids).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "http2", "json", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
# Postgres metadata backend (T153): the maintained pure-Rust driver, blocking API used from
# spawn_blocking threads through a small runtime of its own; TLS through rustls with ring, no OpenSSL.
tokio-postgres = "0.7"
tokio-postgres-rustls = "0.13"
rustls-native-certs = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
quick-xml = "0.38"
thiserror = "2"
time = { version = "0.3", features = ["serde", "formatting", "parsing", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync", "time", "net", "signal"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
toml = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["request-id", "trace", "catch-panic", "util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-normalization = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
zstd = "0.13"

# Test-only
assert_cmd = "2"
# rcgen: test certificates for the TLS tests (not on the allow-list; dev-only, see T010 report).
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
insta = { version = "1", features = ["json"] }
proptest = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"

[profile.release]
lto = "thin"

# Hashing and compression dominate test time; build them optimized even in debug.
[profile.dev.package.blake3]
opt-level = 3

[profile.dev.package.zstd-sys]
opt-level = 3

# Password hashing is deliberately slow; unoptimized it makes tests crawl.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

# Glob matching backs every permission check; keep the bulk-check test fast in debug builds.
[profile.dev.package.globset]
opt-level = 3

[profile.dev.package.regex-automata]
opt-level = 3

[profile.dev.package.aho-corasick]
opt-level = 3

[profile.dev.package.memchr]
opt-level = 3
